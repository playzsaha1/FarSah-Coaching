<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guilds | FarSah Coaching</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="dashboard.html"><span class="brand-mark">FC</span><span>FarSah Coaching</span></a>
      <nav class="nav"><a href="dashboard.html">Dashboard</a><a href="ai-tutor.html">AI Tutor</a><a href="exams.html">Exams</a><a class="active" href="guilds.html">Guilds</a><a href="features.html">Features</a><a href="subscription.html">Plans</a><a href="founders.html">Founders</a><a href="settings.html">Settings</a></nav>
      <button class="icon-button" id="signOutButton" type="button" title="Sign out">↪</button>
    </header>
    <main class="page-shell">
      <section class="page-title"><p class="pill">Party Mode</p><h1>Study Guilds</h1><p>Create your own local guild roster, challenge name, and shared target.</p></section>
      <section class="panel-card">
        <h2>Guild Builder</h2>
        <form class="tool-grid" id="guildForm">
          <label>Guild name<input name="guildName" placeholder="Example: HSC Sprint Squad" /></label>
          <label>Challenge target<input name="guildGoal" placeholder="Example: 8 study sessions this week" /></label>
          <label>Members<input name="guildMembers" placeholder="Names separated by commas" /></label>
          <button class="button primary" type="submit">Save guild</button>
        </form>
      </section>
      <section class="leaderboard panel-card"><h2>Your Guild</h2><div><strong>★</strong><span id="guildNameOutput">No guild yet</span><em id="guildGoalOutput">Add one above</em></div><p id="guildMembersOutput" class="muted">Members will appear here.</p></section>
    </main>
    <script src="auth.js"></script>
    <script src="app.js"></script>
  </body>
</html>
