<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" />
    <title>Settings | FarSah Coaching</title>
    <meta name="theme-color" content="#58cc02" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="white" />
    <meta name="apple-mobile-web-app-title" content="FarSah" />
    <link rel="canonical" href="https://far-sah-coaching.vercel.app/settings.html" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="assets/farsah-study-hero.png" />
    <link rel="apple-touch-icon" href="assets/farsah-study-hero.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="dashboard.html"><span class="brand-mark">FC</span><span>FarSah Coaching</span></a>
      <nav class="nav"><a href="dashboard.html">Dashboard</a><a href="ai-tutor.html">AI Tutor</a><a href="exams.html">Exams</a><a href="guilds.html">Guilds</a><a href="features.html">Features</a><a href="chat.html">Chat</a><a href="subscription.html">Plans</a><a href="founders.html">Founders</a><a class="active" href="settings.html">Settings</a></nav>
      <button class="icon-button" id="signOutButton" type="button" title="Sign out">↪</button>
    </header>
    <main class="page-shell">
      <section class="page-title"><p class="pill">Control Room</p><h1>Settings</h1><p>Add your own profile, subjects, goals, and preferences. Everything stays in this browser.</p></section>
      <section class="panel-card">
        <h2>Your Study Profile</h2>
        <form class="profile-grid" id="profileForm">
          <label>Name<input name="name" placeholder="Your name" /></label>
          <label>Year level<input name="yearLevel" placeholder="Year 11, Year 12, GCSE, IB..." /></label>
          <label>Main subject<input name="subject" placeholder="Your main focus" /></label>
          <label>Exam goal<input name="examGoal" placeholder="Your next exam or goal" /></label>
          <label>Study mode<select name="studyMode"><option>Solo</option><option>Guild</option><option>Sprint</option><option>Exam</option></select></label>
          <label>Daily study target<input name="dailyTarget" placeholder="Example: 90 minutes" /></label>
          <label class="full-width">Learning goals<textarea name="quests" placeholder="One goal per line"></textarea></label>
          <button class="button primary" type="submit">Save profile</button>
        </form>
        <p id="profileStatus" class="status-line" role="status"></p>
      </section>
      <section class="settings-grid">
        <label><input type="checkbox" checked /> Show academic interface</label>
        <label><input type="checkbox" checked /> Save progress locally</label>
        <label><input type="checkbox" /> Private beta display mode</label>
        <label><input type="checkbox" checked /> Show subscription preview</label>
      </section>
    </main>
    <script src="auth.js"></script>
    <script src="app.js"></script>
  </body>
</html>
