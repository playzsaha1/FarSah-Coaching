<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" />
    <title>Chat | FarSah Coaching</title>
    <meta name="theme-color" content="#58cc02" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="white" />
    <meta name="apple-mobile-web-app-title" content="FarSah" />
    <link rel="canonical" href="https://far-sah-coaching.vercel.app/chat.html" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="assets/farsah-study-hero.png" />
    <link rel="apple-touch-icon" href="assets/farsah-study-hero.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="dashboard.html"><span class="brand-mark">FC</span><span>FarSah Coaching</span></a>
      <nav class="nav"><a href="dashboard.html">Dashboard</a><a href="ai-tutor.html">AI Tutor</a><a href="exams.html">Exams</a><a href="guilds.html">Guilds</a><a href="features.html">Features</a><a class="active" href="chat.html">Chat</a><a href="subscription.html">Plans</a><a href="founders.html">Founders</a><a href="settings.html">Settings</a></nav>
      <button class="icon-button" id="signOutButton" type="button" title="Sign out">↪</button>
    </header>
    <main class="page-shell">
      <section class="page-title"><p class="pill">Study Room</p><h1>Study Chat</h1><p>Test the chat experience locally while the platform is still running without an online chat service.</p></section>
      <section class="chat-layout">
        <article class="panel-card">
          <h2>Send Message</h2>
          <form class="stacked-form" id="chatForm">
            <label>Your name<input name="name" id="chatName" placeholder="Sahaan" /></label>
            <label>Message<textarea name="message" id="chatMessage" placeholder="Share an update, question, or study win."></textarea></label>
            <button class="button primary" type="submit">Post message</button>
            <button class="button secondary" id="clearChat" type="button">Clear local chat</button>
          </form>
        </article>
        <article class="panel-card">
          <h2>Room Feed</h2>
          <div class="chat-feed" id="chatFeed"></div>
        </article>
      </section>
    </main>
    <script src="auth.js"></script>
    <script src="app.js"></script>
  </body>
</html>
