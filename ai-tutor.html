    <title>AI Tutor | FarSah Coaching</title>
    <meta name="theme-color" content="#58cc02" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="white" />

    <link rel="apple-touch-icon" href="assets/farsah-study-hero.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="dashboard.html"><span class="brand-mark">FC</span><span>FarSah Coaching</span></a>
      <nav class="nav"><a href="dashboard.html">Dashboard</a><a class="active" href="ai-tutor.html">AI Tutor</a><a href="exams.html">Exams</a><a href="guilds.html">Guilds</a><a href="features.html">Features</a><a href="chat.html">Chat</a><a href="subscription.html">Plans</a><a href="founders.html">Founders</a><a href="settings.html">Settings</a></nav>
      <button class="icon-button" id="signOutButton" type="button" title="Sign out">↪</button>
    </header>
    <main class="page-shell">
      <section class="page-title"><p class="pill">Coach Bot</p><h1>AI Tutor</h1><p>Create a clearer lesson, worked-example plan, and practice ladder from your own topic.</p></section>
      <section class="panel-card">
        <form class="tool-grid">
          <label>Weak topic<input id="topicInput" value="Projectile motion with calculus" /></label>
          <label>Level<select id="levelInput"><option>Year 12 exam-ready</option><option>Year 10 foundations</option><option>Extension challenge</option></select></label>
          <label>Learning style<select id="styleInput"><option>Step-by-step</option><option>Visual analogy</option><option>Exam technique</option><option>Fast recap</option></select></label>
          <label>Time available<select id="timeInput"><option>20 minutes</option><option>35 minutes</option><option>50 minutes</option><option>75 minutes</option></select></label>
          <button class="button primary" id="coachButton" type="button">Generate plan</button>
        </form>
        <div class="response-box" id="coachOutput">Pick a topic to create a coaching plan.</div>
      </section>
    </main>
    <script src="auth.js"></script>
    <script src="app.js"></script>
  </body>
