<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developer Access | FarSah Coaching</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="gate-body">
    <main class="access-card">
      <a class="brand" href="index.html"><span class="brand-mark">FC</span><span>FarSah Coaching</span></a>
      <div class="quest-badge">Learning Access</div>
      <h1>Developer Access</h1>
      <p class="muted">Enter the founder answer and access code to access the learning platform.</p>
      <form id="accessCodeForm" class="stacked-form">
        <label>
          What was the founders first project?
          <input name="answer" autocomplete="off" placeholder="Answer" required />
        </label>
        <label>
          Access code
          <input name="accessCode" autocomplete="off" placeholder="Enter access code" required />
        </label>
        <button class="button primary" type="submit">Access platform</button>
      </form>
      <p id="accessStatus" class="status-line" role="status"></p>
    </main>
    <script src="auth.js"></script>
  </body>
</html>
